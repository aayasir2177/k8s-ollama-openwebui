apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: local-ai
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service:11434"
            - name: WEBUI_AUTH
              value: "true"
            - name: ENV
              value: "prod"
          volumeMounts:
            - name: webui-storage
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
      volumes:
        - name: webui-storage
          persistentVolumeClaim:
            claimName: openwebui-pvc
